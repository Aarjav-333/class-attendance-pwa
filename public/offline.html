<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline - Attendance</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f5f8;
        --surface: #ffffff;
        --fg: #11141a;
        --muted: #5c6472;
        --line: #e2e5eb;
        --brand: #4355dc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0e12;
          --surface: #16191f;
          --fg: #f0f2f6;
          --muted: #9ea6b4;
          --line: #30353f;
          --brand: #7a8aff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(env(safe-area-inset-top), 24px) 20px max(env(safe-area-inset-bottom), 24px);
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px 22px;
        text-align: center;
      }
      h1 {
        margin: 14px 0 6px;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 15px;
      }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 14px;
        background: var(--brand);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
      }
      .icon {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: var(--brand);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3l18 18" />
          <path d="M8.5 15.5a5 5 0 0 1 7 0" />
          <path d="M5 12a10 10 0 0 1 3.2-2.2M19 12a10 10 0 0 0-7.6-2.9" />
        </svg>
      </span>
      <h1>You are offline</h1>
      <p>
        Attendance you already marked is still saved on this device. Reconnect to load or save
        records.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
